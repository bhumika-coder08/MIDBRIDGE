services:
  db:
    image: postgres:16-alpine
    container_name: medbridge-db
    environment:
      POSTGRES_DB: medbridge
      POSTGRES_USER: medbridge
      POSTGRES_PASSWORD: medbridge_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: medbridge-backend
    environment:
      MEDBRIDGE_ENVIRONMENT: development
      MEDBRIDGE_DATABASE_URL: postgresql+psycopg://medbridge:medbridge_dev_password@db:5432/medbridge
      MEDBRIDGE_JWT_SECRET: replace-with-a-long-random-local-secret
      MEDBRIDGE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: medbridge-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
